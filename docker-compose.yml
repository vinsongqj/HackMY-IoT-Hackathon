name: hackmyiot

services:
  backend:
    build:
      context: ./backend
    # Injects backend/.env into the container (Supabase credentials, simulator
    # overrides, parking rate, ...). Copy backend/.env.example to backend/.env
    # and fill it in before running.
    env_file:
      - ./backend/.env
    # Published so a simulator running on the host can POST to
    # http://localhost:8000/webhook, and so the API is reachable directly.
    ports:
      - "8000:8000"
    # Makes host.docker.internal resolve to the host on Linux, so the backend
    # can reach a simulator on the host via http://host.docker.internal:9898.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Optional: let the container read the simulator's own settings file (for its
    # ListenAddress / Name / Password) instead of relying on SIMULATOR_BASE_URL.
    # Uncomment and point at wherever you unzipped the simulator:
    # volumes:
    #   - ./ParkingSimulator-win-x64/settings:/app/ParkingSimulator-win-x64/settings:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
