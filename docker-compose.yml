name: hackmyiot

services:
  backend:
    build:
      context: ./backend
    # Injects backend/.env into the container (Supabase credentials, simulator
    # overrides, parking rate, ...). Copy backend/.env.example to backend/.env
    # and fill it in before running.
    env_file:
      - ./backend/.env
    # Published so a simulator running on the host can POST to
    # http://localhost:8000/webhook, and so the API is reachable directly.
    ports:
      - "8000:8000"
    # Makes host.docker.internal resolve to the host on Linux, so the backend
    # can reach a simulator on the host via http://host.docker.internal:9898.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The backend reads the level layout (settings/lvl1.json) and the simulator
    # settings from ParkingSimulator-*/settings. That folder is gitignored, so it
    # is not baked into the image - mount it read-only instead. Without lvl1.json
    # the backend has no spots to route to and sends every car straight to exit.
    # Point SIMULATOR_FOLDER elsewhere if your folder has a different name.
    volumes:
      - ${SIMULATOR_FOLDER:-./ParkingSimulator-linux-x64}/settings:/app/ParkingSimulator-linux-x64/settings:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
